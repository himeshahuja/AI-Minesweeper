name: Deploy web build to GitHub Pages

# Builds the pygame app for the browser with pygbag (Python + pygame compiled
# to WebAssembly) and publishes it to https://himeshahuja.github.io/AI-Minesweeper/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pygbag==0.9.3
      - run: rm -rf __pycache__ && pygbag --build --title "AI Minesweeper" .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
